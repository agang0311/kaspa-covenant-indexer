[package]
name = "kaspa-covenant-indexer"
version = "0.2.0"
edition = "2024"
description = "Kaspa covenant event indexer, CID REST service and Admin Studio (Rust rewrite, read-only chain access)"
publish = false

[[bin]]
name = "kci"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
blake2b_simd = "1.0.5"
blake3 = "1.8.7"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
hex = "0.4.3"
indexmap = "2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"
fs2 = "0.4"
url = "2.5.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
