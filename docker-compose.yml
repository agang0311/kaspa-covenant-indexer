services:
  indexer:
    build: .
    image: kaspa-covenant-indexer:latest
    container_name: kaspa-covenant-indexer
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      # 管理后台 Token
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # 节点配置（留空则默认使用内置双节点探测池与热备故障转移）
      - KASWIN_NODE_URL=${KASWIN_NODE_URL:-}
      - KASWIN_NODE_URLS=${KASWIN_NODE_URLS:-}
      # 注册表地址（留空使用默认官方 TN10 Registry）
      - KASWIN_REGISTRY_ADDRESSES=${KASWIN_REGISTRY_ADDRESSES:-}
      # 跨域设置（默认允许全部跨域 '*'）
      - KASWIN_CORS_ORIGIN=${KASWIN_CORS_ORIGIN:-*}
    volumes:
      - indexer-data:/data
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  indexer-data:
    name: kaspa-covenant-indexer-data
